<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Theater Hopper</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    select, button, input[type=range] { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #10101c; }
    ::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ── Chain data ───────────────────────────────────────────────────────────
    const CHAIN_DATA = {
      "AMC":                { offset: 25, note: "Officially confirmed 25-30 min; CEO pledged to trim ~4-5 min" },
      "Regal":              { offset: 25, note: "'The Twenty' preshow + trailers = ~25-30 min total" },
      "Cinemark":           { offset: 20, note: "~15-20 min; slightly lighter than AMC/Regal" },
      "Alamo Drafthouse":   { offset: 20, note: "No paid ads — curated clips instead. Movie starts ~20 min after listed time" },
      "Harkins":            { offset: 20, note: "Reportedly lighter than AMC/Regal; ~20 min" },
      "Marcus Theatres":    { offset: 22, note: "Similar to Regal/Cinemark; ~20-25 min" },
      "Showcase Cinemas":   { offset: 22, note: "Uses NCM ads block; ~20-25 min" },
      "iPic":               { offset: 12, note: "Premium/luxury dine-in; shorter preshow ~10-15 min" },
      "Studio Movie Grill": { offset: 18, note: "Dine-in chain; ~15-20 min" },
      "Flix Brewhouse":     { offset: 15, note: "Brewery dine-in; shorter preshow ~15 min" },
      "Look Cinemas":       { offset: 18, note: "Southwest regional; ~15-20 min (estimated)" },
      "Santikos":           { offset: 18, note: "Texas regional; ~15-20 min (estimated)" },
      "B&B Theatres":       { offset: 20, note: "Midwest regional; standard ~20 min" },
      "Celebration Cinema": { offset: 13, note: "Their FAQ officially states 12-15 min" },
    };

    // ── Movies (demo data — real app pulls from TMDB + showtimes API) ────────
    const MOVIES = [
      {
        id: 1, title: "Thunderbolt", genre: "Action", rating: "PG-13", runtime: 118, emoji: "⚡", postCredits: true,
        director: "Alex Reeves",
        cast: ["Jordan Lee", "Sam Park", "Mia Torres"],
        tmdbScore: "7.4",
        trailerUrl: "https://www.youtube.com/results?search_query=thunderbolt+2025+movie+trailer",
        synopsis: "A rogue meteorologist discovers a catastrophic storm system is being weaponized by a shadowy government agency — and she's the only one who can stop it.",
      },
      {
        id: 2, title: "Lost in Time", genre: "Sci-Fi", rating: "PG", runtime: 95, emoji: "🕰️", postCredits: false,
        director: "Priya Nair",
        cast: ["Marcus Webb", "Diane Cho", "Elliot Stone"],
        tmdbScore: "8.1",
        trailerUrl: "https://www.youtube.com/results?search_query=lost+in+time+2025+movie+trailer",
        synopsis: "When a grieving physicist accidentally sends himself back to 1987, he has 72 hours to fix the timeline before his own existence is erased.",
      },
      {
        id: 3, title: "Dark Waters", genre: "Thriller", rating: "R", runtime: 142, emoji: "🌊", postCredits: false,
        director: "Renata Voss",
        cast: ["Cole Harmon", "Yuki Tanaka", "Brett Fallon"],
        tmdbScore: "7.9",
        trailerUrl: "https://www.youtube.com/results?search_query=dark+waters+2025+movie+trailer",
        synopsis: "A deep-sea salvage crew uncovers a century-old wreck — and the classified secret it was carrying that someone will kill to keep buried.",
      },
      {
        id: 4, title: "Comedy Night", genre: "Comedy", rating: "PG-13", runtime: 88, emoji: "😂", postCredits: false,
        director: "Tommy Birch",
        cast: ["Lena Ruiz", "Dev Kapoor", "Scarlett James"],
        tmdbScore: "6.8",
        trailerUrl: "https://www.youtube.com/results?search_query=comedy+night+2025+movie+trailer",
        synopsis: "Three mismatched bridesmaids have 12 hours to pull off the perfect bachelorette party after everything that could go wrong does — spectacularly.",
      },
      {
        id: 5, title: "The Last Stand", genre: "Drama", rating: "R", runtime: 156, emoji: "🎭", postCredits: true,
        director: "Sofia Adler",
        cast: ["Helen Grant", "Noah Osei", "Patricia Sung"],
        tmdbScore: "8.6",
        trailerUrl: "https://www.youtube.com/results?search_query=the+last+stand+2025+drama+trailer",
        synopsis: "A retired public defender takes on one final case — her own, when she's accused of murdering the client she spent 20 years trying to free.",
      },
      {
        id: 6, title: "Neon City", genre: "Action", rating: "PG-13", runtime: 110, emoji: "🌆", postCredits: false,
        director: "James Wu",
        cast: ["Ty Nakamura", "Rosa Vega", "Finn O'Brien"],
        tmdbScore: "7.2",
        trailerUrl: "https://www.youtube.com/results?search_query=neon+city+2025+movie+trailer",
        synopsis: "In a near-future megalopolis, a street-level cop and a corporate hacker form an unlikely alliance to expose the algorithm controlling the city's crime.",
      },
    ];

    // Showtimes in minutes-from-midnight
    const SHOWTIMES = {
      1: [600, 780, 960, 1140],
      2: [630, 765, 900, 1050],
      3: [660, 840, 1050],
      4: [600, 735, 870, 1005, 1140],
      5: [600, 780, 990],
      6: [690, 840, 990, 1140],
    };

    const CREDITS_ESTIMATE = 8;
    const MAX_LOCK_ENTRIES = 3;
    const COLORS = ["#e74c3c", "#3498db", "#16a085", "#e67e22", "#8e44ad", "#27ae60"];

    // Returns all permutations of an array
    function permutations(arr) {
      if (arr.length <= 1) return [[...arr]];
      return arr.flatMap((v, i) =>
        permutations([...arr.slice(0, i), ...arr.slice(i + 1)]).map(p => [v, ...p])
      );
    }

    // ── Utilities ────────────────────────────────────────────────────────────
    function toTime(min) {
      const h = Math.floor(min / 60), m = min % 60;
      const ampm = h >= 12 ? "PM" : "AM";
      const hour = h > 12 ? h - 12 : h === 0 ? 12 : h;
      return `${hour}:${m.toString().padStart(2, "0")} ${ampm}`;
    }
    function toDuration(min) {
      const h = Math.floor(min / 60), m = min % 60;
      if (h === 0) return `${m}m`;
      return m === 0 ? `${h}h` : `${h}h ${m}m`;
    }
    function colorOf(id) { return COLORS[id - 1]; }
    function gapColor(g) { return g < 5 ? "#e74c3c" : g < 15 ? "#f39c12" : "#2ecc71"; }
    function gapEmoji(g) { return g < 5 ? "⚠️" : g < 15 ? "🟡" : "✅"; }

    const DAY_START = 9 * 60, DAY_END = 23 * 60, DAY_DUR = DAY_END - DAY_START;
    const pct      = (m) => `${Math.max(0, Math.min(100, ((m - DAY_START) / DAY_DUR) * 100))}%`;
    const widthPct = (m) => `${Math.max(0, (m / DAY_DUR) * 100)}%`;

    function getDateOptions() {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() + i);
        return {
          label: i === 0 ? "Today" : i === 1 ? "Tomorrow"
            : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
          isToday: i === 0,
        };
      });
    }
    function getNowMinutes() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

    function makeTheme(mode) {
      const dk = mode === "dark";
      return {
        bg:           dk ? "#080810" : "#f0f2f8",
        card:         dk ? "#10101c" : "#ffffff",
        cardBorder:   dk ? "#1e1e30" : "#e0e4f0",
        input:        dk ? "#1a1a28" : "#eef0f8",
        inputBorder:  dk ? "#2a2a40" : "#d0d4e8",
        text:         dk ? "#ffffff" : "#1a1a2e",
        sub:          dk ? "#aaa"    : "#555",
        muted:        dk ? "#666"    : "#888",
        faint:        dk ? "#444"    : "#bbb",
        timeline:     dk ? "#060609" : "#e4e8f4",
        timelineLine: dk ? "#191926" : "#d0d4e8",
        timelineText: dk ? "#333"    : "#aaa",
        tagBg:        dk ? "#080810" : "#eef0f8",
        dashed:       dk ? "#2a2a40" : "#c8cce0",
        hint:         dk ? "#777"    : "#999",
        synopsisBg:   dk ? "#0d0d1a" : "#eef0f8",
        planBg:       dk ? "#0d0d1a" : "#f8f9ff",
        warnBg:       dk ? "#e74c3c18" : "#fff0f0",
        warnBorder:   dk ? "#e74c3c44" : "#f5c0c0",
      };
    }

    // ── Shared suggestion card list ──────────────────────────────────────────
    function SuggestionList({ items, T, realStart, effectiveEnd, loadPlan, cardAccent }) {
      return (
        <div style={{ display: "flex", gap: "12px", flexWrap: "wrap" }}>
          {items.map((item, idx) => (
            <button key={idx} onClick={() => loadPlan(item.combo)}
              style={{ background: T.card, border: `1px solid ${cardAccent ? cardAccent + "55" : T.cardBorder}`, borderRadius: "10px", padding: "14px 16px", cursor: "pointer", textAlign: "left", minWidth: "210px", transition: "border-color 0.15s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = cardAccent || "#f7971e"}
              onMouseLeave={e => e.currentTarget.style.borderColor = cardAccent ? cardAccent + "55" : T.cardBorder}>
              <div style={{ fontSize: "0.82rem", fontWeight: 700, color: T.text, marginBottom: "8px" }}>
                Option {idx + 1} &nbsp;·&nbsp; {item.movieCount} movies &nbsp;·&nbsp; {toDuration(item.totalTime)}
              </div>
              {item.combo.map((s, i) => {
                const movie = MOVIES.find(m => m.id === s.movieId);
                const gap   = i > 0 ? realStart(s.posted) - effectiveEnd(item.combo[i-1].movieId, item.combo[i-1].posted) : null;
                return (
                  <React.Fragment key={i}>
                    {gap !== null && (
                      <div style={{ fontSize: "0.68rem", color: gapColor(gap), paddingLeft: "14px", margin: "2px 0" }}>
                        {gapEmoji(gap)} {toDuration(gap)} gap
                      </div>
                    )}
                    <div style={{ display: "flex", alignItems: "center", gap: "6px", fontSize: "0.78rem", color: T.sub }}>
                      <div style={{ width: "8px", height: "8px", borderRadius: "2px", background: colorOf(s.movieId), flexShrink: 0 }} />
                      {movie.emoji} {movie.title}
                      <span style={{ color: T.muted, marginLeft: "auto" }}>{toTime(realStart(s.posted))}</span>
                    </div>
                  </React.Fragment>
                );
              })}
              <div style={{ fontSize: "0.7rem", color: T.muted, marginTop: "8px", borderTop: `1px solid ${T.cardBorder}`, paddingTop: "6px" }}>
                {toDuration(item.totalGap)} total gap · tap to load
              </div>
            </button>
          ))}
        </div>
      );
    }

    // ── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [chain,       setChain]       = useState("AMC");
      const [buffer,      setBuffer]      = useState(15);
      const [plan,        setPlan]        = useState([]);
      const [dateIdx,     setDateIdx]     = useState(0);
      const [skipCredits, setSkipCredits] = useState(false);
      const [theme,       setTheme]       = useState("dark");
      const [planOpen,    setPlanOpen]    = useState(false);
      const [planMode,    setPlanMode]    = useState("quick");
      const [quickPreset,    setQuickPreset]    = useState(null);
      const [quickSuggestions, setQuickSuggestions] = useState([]);   // Quick Plans results
      const [lockJustPicks,  setLockJustPicks]  = useState([]);       // Lock In: just picked movies
      const [lockFillGaps,   setLockFillGaps]   = useState([]);       // Lock In: picked + extras
      const [noComboMsg,     setNoComboMsg]      = useState("");
      // Lock In entries: array of { movieId: "", showtime: "" }
      const [lockEntries, setLockEntries] = useState([{ movieId: "", showtime: "" }]);
      const [expandedId,  setExpandedId]  = useState(null);
      const [copied,      setCopied]      = useState(false);
      const [toast,       setToast]       = useState("");

      const T           = useMemo(() => makeTheme(theme), [theme]);
      const dateOptions = useMemo(() => getDateOptions(), []);
      const isToday     = dateOptions[dateIdx].isToday;
      const nowMinutes  = getNowMinutes();
      const offset      = CHAIN_DATA[chain].offset;

      // ── Time core ────────────────────────────────────────────────────────
      const realStart       = (p)              => p + offset;
      const effectiveEndWith = (id, p, skip)   => realStart(p) + MOVIES.find(m => m.id === id).runtime - (skip ? CREDITS_ESTIMATE : 0);
      const effectiveEnd    = (id, p)          => effectiveEndWith(id, p, skipCredits);
      const isJoinable      = (p)              => !isToday || realStart(p) > nowMinutes;
      const isSelected      = (id, p)          => plan.some(s => s.movieId === id && s.posted === p);

      const isAvailable = (id, p) => {
        if (!isJoinable(p)) return false;
        if (plan.length === 0) return true;
        const last = plan[plan.length - 1];
        return realStart(p) - effectiveEnd(last.movieId, last.posted) >= buffer && id !== last.movieId;
      };

      const gapFromLast = (id, p) => {
        if (plan.length === 0 || !isAvailable(id, p)) return null;
        return realStart(p) - effectiveEnd(plan[plan.length - 1].movieId, plan[plan.length - 1].posted);
      };

      // ── Buffer: trim plan instead of clear ───────────────────────────────
      const handleBufferChange = (v) => {
        setBuffer(v);
        for (let i = 1; i < plan.length; i++) {
          if (realStart(plan[i].posted) - effectiveEnd(plan[i-1].movieId, plan[i-1].posted) < v) {
            setPlan(plan.slice(0, i)); return;
          }
        }
      };

      // ── Skip credits: re-validate on turn-off ────────────────────────────
      const handleSkipCredits = (v) => {
        setSkipCredits(v);
        if (!v) {
          for (let i = 1; i < plan.length; i++) {
            if (realStart(plan[i].posted) - effectiveEndWith(plan[i-1].movieId, plan[i-1].posted, false) < buffer) {
              setPlan(plan.slice(0, i)); return;
            }
          }
        }
      };

      // ── Manual click ─────────────────────────────────────────────────────
      const handleClick = (id, p) => {
        if (isSelected(id, p)) { setPlan(plan.slice(0, plan.findIndex(s => s.movieId === id && s.posted === p))); return; }
        if (isAvailable(id, p)) setPlan([...plan, { movieId: id, posted: p }]);
      };

      // ── Lock In entry management ─────────────────────────────────────────
      const clearLockResults = () => { setLockJustPicks([]); setLockFillGaps([]); setNoComboMsg(""); };
      const updateLockEntry  = (idx, field, val) => {
        const next = lockEntries.map((e, i) => i === idx ? { ...e, [field]: val, ...(field === "movieId" ? { showtime: "" } : {}) } : e);
        setLockEntries(next); clearLockResults();
      };
      const addLockEntry    = () => { if (lockEntries.length < MAX_LOCK_ENTRIES) setLockEntries([...lockEntries, { movieId: "", showtime: "" }]); };
      const removeLockEntry = (idx) => { setLockEntries(lockEntries.filter((_, i) => i !== idx)); clearLockResults(); };

      // ── Combo generation ─────────────────────────────────────────────────
      const generateAllCombos = () => {
        const screenings = MOVIES.flatMap(m => SHOWTIMES[m.id].filter(p => isJoinable(p)).map(p => ({ movieId: m.id, posted: p })));
        screenings.sort((a, b) => realStart(a.posted) - realStart(b.posted));
        const results = [];
        function bt(cur) {
          if (cur.length >= 2) results.push([...cur]);
          if (cur.length >= 4) return;
          const last = cur[cur.length - 1], end = effectiveEnd(last.movieId, last.posted);
          for (const s of screenings) {
            if (cur.some(c => c.movieId === s.movieId)) continue;
            if (realStart(s.posted) >= end + buffer) { cur.push(s); bt(cur); cur.pop(); }
          }
        }
        screenings.forEach(s => bt([s]));
        return results;
      };

      // Generates combos using ONLY the locked movies, in every valid ordering
      const generateJustPicksCombos = (valid) => {
        const movieIds = valid.map(e => Number(e.movieId));
        const perms    = permutations(movieIds);
        const results  = [];
        for (const perm of perms) {
          function bt(idx, current, lastEnd) {
            if (idx === perm.length) {
              if (current.length >= 2) results.push([...current]);
              return;
            }
            const mid   = perm[idx];
            const entry = valid.find(e => Number(e.movieId) === mid);
            const times = entry?.showtime
              ? [Number(entry.showtime)]
              : (SHOWTIMES[mid] || []).filter(p => isJoinable(p));
            for (const posted of times) {
              if (idx === 0 || realStart(posted) >= lastEnd + buffer) {
                current.push({ movieId: mid, posted });
                bt(idx + 1, current, effectiveEnd(mid, posted));
                current.pop();
              }
            }
          }
          bt(0, [], 0);
        }
        return results;
      };

      const scoreCombo = (combo) => {
        const first = realStart(combo[0].posted);
        const last  = effectiveEnd(combo[combo.length-1].movieId, combo[combo.length-1].posted);
        let totalGap = 0;
        for (let i = 1; i < combo.length; i++)
          totalGap += realStart(combo[i].posted) - effectiveEnd(combo[i-1].movieId, combo[i-1].posted);
        return { movieCount: combo.length, totalGap, totalTime: last - first };
      };

      const dedupeSlice = (scored, n = 3) => {
        const seen = new Set(), out = [];
        for (const item of scored) {
          const key = item.combo.map(s => `${s.movieId}:${s.posted}`).join(",");
          if (!seen.has(key)) { seen.add(key); out.push(item); }
          if (out.length === n) break;
        }
        return out;
      };

      const handleQuickPlan = (preset) => {
        setQuickPreset(preset); setNoComboMsg("");
        const combos = generateAllCombos();
        if (!combos.length) { setQuickSuggestions([]); setNoComboMsg("no_general"); return; }
        const scored = combos.map(c => ({ combo: c, ...scoreCombo(c) }));
        const sorted =
          preset === "most"     ? [...scored].sort((a,b) => b.movieCount-a.movieCount || a.totalGap-b.totalGap) :
          preset === "gaps"     ? [...scored].sort((a,b) => a.totalGap-b.totalGap     || b.movieCount-a.movieCount) :
                                  [...scored].sort((a,b) => a.totalTime-b.totalTime   || b.movieCount-a.movieCount);
        setQuickSuggestions(dedupeSlice(sorted));
      };

      const handleLockIn = () => {
        const valid = lockEntries.filter(e => e.movieId);
        if (!valid.length) return;
        setNoComboMsg(""); setLockJustPicks([]); setLockFillGaps([]);

        const names = valid.map(e => MOVIES.find(m => m.id === Number(e.movieId))?.title).filter(Boolean);

        // ── Section 1: Just your picks (only when 2+ movies locked) ─────────
        if (valid.length >= 2) {
          const justCombos = generateJustPicksCombos(valid);
          if (justCombos.length) {
            const scored = justCombos.map(c => ({ combo: c, ...scoreCombo(c) }));
            const sorted = [...scored].sort((a,b) => a.totalGap - b.totalGap || a.totalTime - b.totalTime);
            setLockJustPicks(dedupeSlice(sorted));
          }
        }

        // ── Section 2: Fill the gaps (locked movies + extras) ───────────────
        const all      = generateAllCombos();
        const filtered = all.filter(combo =>
          valid.every(entry =>
            combo.some(s => s.movieId === Number(entry.movieId) && (!entry.showtime || s.posted === Number(entry.showtime)))
          )
        );
        if (filtered.length) {
          const scored = filtered.map(c => ({ combo: c, ...scoreCombo(c) }));
          const sorted = [...scored].sort((a,b) => b.movieCount-a.movieCount || a.totalGap-b.totalGap);
          setLockFillGaps(dedupeSlice(sorted));
        }

        // ── No results at all ────────────────────────────────────────────────
        if (!filtered.length && (valid.length < 2 || !generateJustPicksCombos(valid).length)) {
          setNoComboMsg(names.length > 1
            ? `No valid schedule found for ${names.join(" + ")}. Try different showtimes, reduce your buffer, or enable Skip Credits.`
            : `No valid combinations found around "${names[0]}". Try a different showtime or reduce your buffer.`
          );
        }
      };

      const loadPlan = (combo) => {
        setPlan(combo); setPlanOpen(false);
        setQuickSuggestions([]); setLockJustPicks([]); setLockFillGaps([]); setNoComboMsg("");
      };

      // ── Plan stats ───────────────────────────────────────────────────────
      const planFirst = plan.length > 0 ? realStart(plan[0].posted) : null;
      const planLast  = plan.length > 0 ? effectiveEnd(plan[plan.length-1].movieId, plan[plan.length-1].posted) : null;
      const postCreditsConflict = skipCredits && plan.some(s => MOVIES.find(m => m.id === s.movieId)?.postCredits);

      // ── Share helpers ────────────────────────────────────────────────────
      const generatePlanText = () => {
        const lines = [
          `🎬 Theater Hopper — ${chain} · ${dateOptions[dateIdx].label}`,
          `Arrive: ${toTime(planFirst)}   Leave: ${toTime(planLast)}   (${toDuration(planLast - planFirst)} total)`,
          ``,
        ];
        plan.forEach((s, i) => {
          const movie = MOVIES.find(m => m.id === s.movieId);
          const rs = realStart(s.posted);
          const re = effectiveEnd(s.movieId, s.posted);
          if (i > 0) {
            const gap = rs - effectiveEnd(plan[i-1].movieId, plan[i-1].posted);
            lines.push(`   ↕ ${toDuration(gap)} gap`);
          }
          lines.push(`${i+1}. ${movie.emoji} ${movie.title} · ${toTime(rs)} – ${toTime(re)}${movie.postCredits ? " ⚡" : ""}`);
        });
        lines.push(``, `(${skipCredits ? "Leaving before credits" : "Staying for credits"} · ${buffer}min personal buffer)`);
        return lines.join("\n");
      };
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 2500);
      };
      const copyPlan = () => {
        navigator.clipboard.writeText(generatePlanText()).then(() => {
          setCopied(true);
          showToast("📋 Plan copied to clipboard!");
          setTimeout(() => setCopied(false), 2000);
        });
      };
      const sharePlan = async () => {
        const text = generatePlanText();
        if (navigator.share) {
          try {
            await navigator.share({ title: "🎬 Theater Hopper Plan", text });
          } catch (e) {
            // user cancelled — do nothing
          }
        } else {
          // Fallback for browsers without Share API
          navigator.clipboard.writeText(text).then(() => {
            setCopied(true);
            showToast("📋 Copied! (Share not available on this browser)");
            setTimeout(() => setCopied(false), 2000);
          });
        }
      };

      // ── Render ───────────────────────────────────────────────────────────
      return (
        <div style={{ background: T.bg, minHeight: "100vh", color: T.text, padding: "20px 24px", transition: "background 0.25s, color 0.25s" }}>

          {/* HEADER */}
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "18px", gap: "12px", flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: "2rem", fontWeight: 900, background: "linear-gradient(135deg,#f7971e,#ffd200)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", letterSpacing: "-0.5px" }}>
                🎬 Theater Hopper
              </div>
              <div style={{ color: T.muted, fontSize: "0.82rem", marginTop: "3px" }}>
                AMC Burbank 16 &nbsp;·&nbsp; <span style={{ color: "#f7971e88" }}>Demo Mode</span>
              </div>
            </div>
            <div style={{ display: "flex", gap: "10px", alignItems: "center", flexWrap: "wrap" }}>
              <button onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}
                style={{ background: T.input, border: `1px solid ${T.inputBorder}`, borderRadius: "20px", padding: "7px 14px", cursor: "pointer", fontSize: "0.85rem", color: T.text, fontWeight: 600 }}>
                {theme === "dark" ? "☀️ Light" : "🌙 Dark"}
              </button>
              {plan.length > 0 && (
                <button onClick={() => setPlan([])} style={{ padding: "7px 14px", borderRadius: "8px", border: "1px solid #e74c3c55", background: "transparent", color: "#e74c3c", cursor: "pointer", fontSize: "0.82rem" }}>
                  ✕ Clear Day
                </button>
              )}
            </div>
          </div>

          {/* DATE PICKER */}
          <div style={{ display: "flex", gap: "8px", marginBottom: "16px", flexWrap: "wrap" }}>
            {dateOptions.map((d, i) => (
              <button key={i} onClick={() => { setDateIdx(i); setPlan([]); setQuickSuggestions([]); setLockJustPicks([]); setLockFillGaps([]); setQuickPreset(null); setNoComboMsg(""); }}
                style={{ padding: "7px 16px", borderRadius: "20px", border: `1px solid ${dateIdx === i ? "#f7971e" : T.inputBorder}`, background: dateIdx === i ? "#f7971e22" : T.input, color: dateIdx === i ? "#f7971e" : T.sub, cursor: "pointer", fontSize: "0.82rem", fontWeight: dateIdx === i ? 700 : 400, transition: "all 0.15s" }}>
                {d.label}
              </button>
            ))}
          </div>

          {/* SETTINGS */}
          <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: "14px", padding: "18px 20px", marginBottom: "14px", display: "flex", gap: "28px", flexWrap: "wrap", alignItems: "flex-start" }}>
            {/* Chain */}
            <div>
              <div style={{ fontSize: "0.68rem", color: T.muted, letterSpacing: "0.08em", marginBottom: "8px" }}>THEATER CHAIN</div>
              <select value={chain} onChange={e => { setChain(e.target.value); setPlan([]); setQuickSuggestions([]); setLockJustPicks([]); setLockFillGaps([]); }}
                style={{ background: T.input, color: T.text, border: `1px solid ${T.inputBorder}`, borderRadius: "8px", padding: "8px 12px", fontSize: "0.9rem", cursor: "pointer" }}>
                {Object.keys(CHAIN_DATA).map(c => <option key={c}>{c}</option>)}
              </select>
              <div style={{ marginTop: "6px" }}>
                <span style={{ fontSize: "0.78rem", color: "#f7971e", fontWeight: 700 }}>+{offset} min preshow</span>
                <div style={{ fontSize: "0.72rem", color: T.sub, marginTop: "3px", maxWidth: "300px", lineHeight: "1.45" }}>📌 {CHAIN_DATA[chain].note}</div>
              </div>
            </div>
            {/* Buffer */}
            <div>
              <div style={{ fontSize: "0.68rem", color: T.muted, letterSpacing: "0.08em", marginBottom: "8px" }}>
                PERSONAL BUFFER: <span style={{ color: "#ffd200" }}>{buffer === 0 ? "none" : `${buffer} min`}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <span style={{ fontSize: "0.72rem", color: T.faint }}>0</span>
                <input type="range" min={0} max={30} step={5} value={buffer} onChange={e => handleBufferChange(Number(e.target.value))}
                  style={{ width: "130px", accentColor: "#f7971e", cursor: "pointer" }} />
                <span style={{ fontSize: "0.72rem", color: T.faint }}>30m</span>
              </div>
              <div style={{ fontSize: "0.7rem", color: T.muted, marginTop: "5px" }}>bathroom · snacks · walking</div>
            </div>
            {/* Skip Credits */}
            <div>
              <div style={{ fontSize: "0.68rem", color: T.muted, letterSpacing: "0.08em", marginBottom: "8px" }}>CREDITS</div>
              <button onClick={() => handleSkipCredits(!skipCredits)}
                style={{ padding: "7px 16px", borderRadius: "20px", border: `1px solid ${skipCredits ? "#f7971e" : T.inputBorder}`, background: skipCredits ? "#f7971e22" : "transparent", color: skipCredits ? "#f7971e" : T.sub, cursor: "pointer", fontSize: "0.82rem", fontWeight: skipCredits ? 700 : 400, transition: "all 0.15s" }}>
                {skipCredits ? "✓ Skip Credits (−8 min)" : "Watch Full Credits"}
              </button>
              <div style={{ fontSize: "0.7rem", color: T.muted, marginTop: "5px" }}>Leave early = more hopping options</div>
            </div>
          </div>

          {/* Post-credits warning */}
          {postCreditsConflict && (
            <div style={{ background: T.warnBg, border: `1px solid ${T.warnBorder}`, borderRadius: "10px", padding: "10px 16px", marginBottom: "12px", fontSize: "0.82rem", color: "#e74c3c", lineHeight: "1.5" }}>
              ⚡ One or more movies in your plan have a mid or post-credits scene. Leaving during credits means you'd miss it.
            </div>
          )}

          {/* PLAN MY DAY */}
          <div style={{ marginBottom: "16px" }}>
            <button onClick={() => { setPlanOpen(o => !o); if (planOpen) { setQuickSuggestions([]); setLockJustPicks([]); setLockFillGaps([]); setQuickPreset(null); setNoComboMsg(""); } }}
              style={{ width: "100%", textAlign: "left", background: "linear-gradient(135deg,#f7971e,#ffd200)", border: "none", borderRadius: planOpen ? "12px 12px 0 0" : "12px", padding: "12px 20px", cursor: "pointer", fontSize: "0.95rem", fontWeight: 800, color: "#000", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span>🎯 Plan My Day</span>
              <span style={{ fontSize: "0.8rem", opacity: 0.7 }}>{planOpen ? "▲ close" : "▼ open"}</span>
            </button>

            {planOpen && (
              <div style={{ background: T.planBg, border: `1px solid ${T.cardBorder}`, borderTop: "none", borderRadius: "0 0 12px 12px", padding: "20px" }}>

                {/* Tabs */}
                <div style={{ display: "flex", gap: "8px", marginBottom: "18px" }}>
                  {[["quick","⚡ Quick Plans"],["lockin","🔒 Lock In Movies"]].map(([mode,label]) => (
                    <button key={mode} onClick={() => { setPlanMode(mode); setQuickSuggestions([]); setLockJustPicks([]); setLockFillGaps([]); setQuickPreset(null); setNoComboMsg(""); }}
                      style={{ padding: "8px 18px", borderRadius: "20px", border: `1px solid ${planMode === mode ? "#f7971e" : T.inputBorder}`, background: planMode === mode ? "#f7971e22" : "transparent", color: planMode === mode ? "#f7971e" : T.sub, cursor: "pointer", fontSize: "0.85rem", fontWeight: planMode === mode ? 700 : 400, transition: "all 0.15s" }}>
                      {label}
                    </button>
                  ))}
                </div>

                {/* Quick Plans */}
                {planMode === "quick" && (
                  <div>
                    <p style={{ fontSize: "0.82rem", color: T.sub, marginBottom: "14px" }}>Choose a style — we'll find the best combinations available today.</p>
                    <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
                      {[
                        ["most",     "🎬 Most Movies",   "Pack in as many films as possible"],
                        ["gaps",     "🧘 Fewest Gaps",   "Minimize dead time between movies"],
                        ["shortest", "⏱️ Shortest Day", "Done earliest, most compact schedule"],
                      ].map(([preset, label, desc]) => (
                        <button key={preset} onClick={() => handleQuickPlan(preset)}
                          style={{ padding: "12px 16px", borderRadius: "10px", border: `2px solid ${quickPreset === preset ? "#f7971e" : T.inputBorder}`, background: quickPreset === preset ? "#f7971e18" : T.input, color: quickPreset === preset ? "#f7971e" : T.text, cursor: "pointer", textAlign: "left", minWidth: "155px", transition: "all 0.15s" }}>
                          <div style={{ fontWeight: 700, fontSize: "0.88rem", marginBottom: "3px" }}>{label}</div>
                          <div style={{ fontSize: "0.7rem", color: quickPreset === preset ? "#f7971eaa" : T.muted }}>{desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Lock In */}
                {planMode === "lockin" && (
                  <div>
                    <p style={{ fontSize: "0.82rem", color: T.sub, marginBottom: "14px" }}>
                      Lock in your must-see movies and we'll build the best day around them.
                      <span style={{ color: T.muted }}> (Up to {MAX_LOCK_ENTRIES})</span>
                    </p>

                    <div style={{ display: "flex", flexDirection: "column", gap: "10px", marginBottom: "14px" }}>
                      {lockEntries.map((entry, idx) => (
                        <div key={idx} style={{ display: "flex", gap: "10px", alignItems: "flex-end", flexWrap: "wrap" }}>
                          {/* Entry number badge */}
                          <div style={{ width: "24px", height: "24px", borderRadius: "50%", background: "#f7971e22", border: "1px solid #f7971e55", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.72rem", color: "#f7971e", fontWeight: 700, flexShrink: 0, marginBottom: "8px" }}>
                            {idx + 1}
                          </div>
                          {/* Movie picker */}
                          <div>
                            <div style={{ fontSize: "0.65rem", color: T.muted, letterSpacing: "0.08em", marginBottom: "5px" }}>MOVIE</div>
                            <select value={entry.movieId} onChange={e => updateLockEntry(idx, "movieId", e.target.value)}
                              style={{ background: T.input, color: T.text, border: `1px solid ${T.inputBorder}`, borderRadius: "8px", padding: "7px 12px", fontSize: "0.88rem", cursor: "pointer" }}>
                              <option value="">Pick a movie...</option>
                              {MOVIES.map(m => (
                                <option key={m.id} value={m.id}
                                  disabled={lockEntries.some((e, i) => i !== idx && e.movieId === String(m.id))}>
                                  {m.emoji} {m.title}
                                </option>
                              ))}
                            </select>
                          </div>
                          {/* Showtime picker */}
                          {entry.movieId && (
                            <div>
                              <div style={{ fontSize: "0.65rem", color: T.muted, letterSpacing: "0.08em", marginBottom: "5px" }}>
                                SHOWTIME <span style={{ color: T.faint }}>(optional)</span>
                              </div>
                              <select value={entry.showtime} onChange={e => updateLockEntry(idx, "showtime", e.target.value)}
                                style={{ background: T.input, color: T.text, border: `1px solid ${T.inputBorder}`, borderRadius: "8px", padding: "7px 12px", fontSize: "0.88rem", cursor: "pointer" }}>
                                <option value="">Any showtime</option>
                                {(SHOWTIMES[Number(entry.movieId)] || []).filter(p => isJoinable(p)).map(p => (
                                  <option key={p} value={p}>{toTime(p)}</option>
                                ))}
                              </select>
                            </div>
                          )}
                          {/* Remove button */}
                          {lockEntries.length > 1 && (
                            <button onClick={() => removeLockEntry(idx)}
                              style={{ padding: "7px 10px", borderRadius: "8px", border: `1px solid ${T.inputBorder}`, background: "transparent", color: T.muted, cursor: "pointer", fontSize: "0.8rem", marginBottom: "1px" }}>
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>

                    {/* Add another + Build row */}
                    <div style={{ display: "flex", gap: "10px", alignItems: "center", flexWrap: "wrap" }}>
                      {lockEntries.length < MAX_LOCK_ENTRIES && (
                        <button onClick={addLockEntry}
                          style={{ padding: "8px 16px", borderRadius: "20px", border: `1px dashed ${T.inputBorder}`, background: "transparent", color: T.sub, cursor: "pointer", fontSize: "0.82rem" }}>
                          ＋ Add another must-see
                        </button>
                      )}
                      <button onClick={handleLockIn} disabled={!lockEntries.some(e => e.movieId)}
                        style={{ padding: "9px 20px", borderRadius: "8px", border: "none", background: lockEntries.some(e => e.movieId) ? "#f7971e" : T.inputBorder, color: lockEntries.some(e => e.movieId) ? "#000" : T.muted, cursor: lockEntries.some(e => e.movieId) ? "pointer" : "default", fontWeight: 800, fontSize: "0.88rem" }}>
                        Build My Day →
                      </button>
                    </div>
                  </div>
                )}

                {/* ── Quick Plans results ── */}
                {planMode === "quick" && quickSuggestions.length > 0 && (
                  <SuggestionList items={quickSuggestions} T={T} realStart={realStart} effectiveEnd={effectiveEnd} loadPlan={loadPlan} />
                )}

                {/* ── Lock In results: two sections ── */}
                {planMode === "lockin" && (lockJustPicks.length > 0 || lockFillGaps.length > 0) && (
                  <div style={{ marginTop: "20px", display: "flex", flexDirection: "column", gap: "24px" }}>

                    {/* Section 1: Just your picks */}
                    {lockJustPicks.length > 0 && (
                      <div>
                        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px" }}>
                          <div style={{ height: "1px", flex: 1, background: T.cardBorder }} />
                          <span style={{ fontSize: "0.72rem", color: "#f7971e", fontWeight: 700, letterSpacing: "0.06em", whiteSpace: "nowrap" }}>
                            🔒 JUST YOUR PICKS
                          </span>
                          <div style={{ height: "1px", flex: 1, background: T.cardBorder }} />
                        </div>
                        <p style={{ fontSize: "0.75rem", color: T.muted, marginBottom: "10px" }}>Only the movies you locked in, scheduled as tightly as possible.</p>
                        <SuggestionList items={lockJustPicks} T={T} realStart={realStart} effectiveEnd={effectiveEnd} loadPlan={loadPlan} cardAccent="#f7971e" />
                      </div>
                    )}

                    {/* Section 2: Fill the gaps */}
                    {lockFillGaps.length > 0 && (
                      <div>
                        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px" }}>
                          <div style={{ height: "1px", flex: 1, background: T.cardBorder }} />
                          <span style={{ fontSize: "0.72rem", color: T.sub, fontWeight: 700, letterSpacing: "0.06em", whiteSpace: "nowrap" }}>
                            🎬 FILL THE GAPS
                          </span>
                          <div style={{ height: "1px", flex: 1, background: T.cardBorder }} />
                        </div>
                        <p style={{ fontSize: "0.75rem", color: T.muted, marginBottom: "10px" }}>Your picks plus other movies that fit around them.</p>
                        <SuggestionList items={lockFillGaps} T={T} realStart={realStart} effectiveEnd={effectiveEnd} loadPlan={loadPlan} />
                      </div>
                    )}
                  </div>
                )}

                {/* No combo / error message */}
                {noComboMsg && (
                  <div style={{ marginTop: "16px", background: T.warnBg, border: `1px solid ${T.warnBorder}`, borderRadius: "8px", padding: "12px 16px", fontSize: "0.82rem", color: "#e74c3c", lineHeight: "1.5" }}>
                    {noComboMsg === "no_general"
                      ? "No valid combinations found for the remaining showtimes. Try adjusting your buffer, enabling Skip Credits, or checking another day."
                      : noComboMsg}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* YOUR DAY */}
          {plan.length > 0 ? (
            <div style={{ background: T.card, border: "1px solid #f7971e22", borderRadius: "14px", padding: "20px", marginBottom: "20px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "20px", flexWrap: "wrap", gap: "14px" }}>
                <div style={{ display: "flex", gap: "28px", flexWrap: "wrap" }}>
                  {[["MOVIES",`🎬 ${plan.length}`],["TOTAL TIME",`⏱️ ${toDuration(planLast-planFirst)}`],["ARRIVE",`🚪 ${toTime(planFirst)}`],["LEAVE",`🌙 ${toTime(planLast)}`]].map(([label,val]) => (
                    <div key={label}>
                      <div style={{ fontSize: "0.65rem", color: T.muted, letterSpacing: "0.1em", marginBottom: "4px" }}>{label}</div>
                      <div style={{ fontSize: "1.5rem", fontWeight: 800, color: "#ffd200", lineHeight: 1 }}>{val}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                  <button onClick={copyPlan}
                    style={{ padding: "8px 14px", borderRadius: "20px", border: `1px solid ${T.inputBorder}`, background: copied ? "#2ecc7122" : T.input, color: copied ? "#2ecc71" : T.sub, cursor: "pointer", fontSize: "0.8rem", fontWeight: copied ? 700 : 400, transition: "all 0.2s", whiteSpace: "nowrap" }}>
                    {copied ? "✓ Copied!" : "📋 Copy"}
                  </button>
                  <button onClick={sharePlan}
                    style={{ padding: "8px 14px", borderRadius: "20px", border: "1px solid #3498db55", background: "#3498db11", color: "#3498db", cursor: "pointer", fontSize: "0.8rem", fontWeight: 600, whiteSpace: "nowrap" }}>
                    🔗 Share
                  </button>
                </div>
              </div>

              {/* Timeline */}
              <div style={{ position: "relative", height: "52px", background: T.timeline, borderRadius: "10px", overflow: "hidden", marginBottom: "14px" }}>
                {[9,11,13,15,17,19,21,23].map(h => (
                  <div key={h} style={{ position: "absolute", left: pct(h*60), top: 0, bottom: 0, borderLeft: `1px solid ${T.timelineLine}` }}>
                    <span style={{ fontSize: "0.58rem", color: T.timelineText, position: "absolute", bottom: "4px", left: "3px" }}>{h>12?`${h-12}p`:`${h}a`}</span>
                  </div>
                ))}
                {plan.map((s, i) => {
                  const movie = MOVIES.find(m => m.id === s.movieId);
                  const dur   = movie.runtime - (skipCredits ? CREDITS_ESTIMATE : 0);
                  return (
                    <div key={i} title={`${movie.title} · ${toTime(realStart(s.posted))}–${toTime(effectiveEnd(s.movieId,s.posted))}\nClick to remove`}
                      onClick={() => handleClick(s.movieId, s.posted)}
                      style={{ position: "absolute", left: pct(realStart(s.posted)), width: widthPct(dur), top: "7px", bottom: "7px", background: colorOf(s.movieId), borderRadius: "6px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.67rem", fontWeight: 700, overflow: "hidden", whiteSpace: "nowrap", padding: "0 6px", cursor: "pointer", boxShadow: `0 0 12px ${colorOf(s.movieId)}55` }}>
                      <span style={{ opacity: 0.75, marginRight: "3px" }}>{i+1}</span>{movie.emoji} {movie.title}
                    </div>
                  );
                })}
              </div>

              {/* Legend */}
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "center" }}>
                {plan.map((s, i) => {
                  const movie = MOVIES.find(m => m.id === s.movieId);
                  const rs    = realStart(s.posted);
                  const re    = effectiveEnd(s.movieId, s.posted);
                  const gap   = i > 0 ? rs - effectiveEnd(plan[i-1].movieId, plan[i-1].posted) : null;
                  return (
                    <React.Fragment key={i}>
                      {gap !== null && (
                        <div style={{ fontSize: "0.75rem", color: gapColor(gap), fontWeight: 700, display: "flex", alignItems: "center", gap: "3px" }}>
                          {gapEmoji(gap)} {toDuration(gap)}
                        </div>
                      )}
                      <div style={{ display: "flex", alignItems: "center", gap: "7px", background: T.tagBg, borderRadius: "8px", padding: "7px 11px" }}>
                        <div style={{ width: "20px", height: "20px", borderRadius: "50%", background: colorOf(s.movieId)+"22", border: `1px solid ${colorOf(s.movieId)}66`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.7rem", fontWeight: 800, color: colorOf(s.movieId), flexShrink: 0 }}>{i+1}</div>
                        <span style={{ fontSize: "0.82rem", fontWeight: 600 }}>{movie.emoji} {movie.title}</span>
                        {movie.postCredits && <span title="Post-credits scene!" style={{ fontSize: "0.72rem" }}>⚡</span>}
                        <span style={{ fontSize: "0.74rem", color: T.muted }}>{toTime(rs)}–{toTime(re)}</span>
                        <button onClick={() => handleClick(s.movieId, s.posted)} style={{ background: "none", border: "none", color: T.faint, cursor: "pointer", fontSize: "0.72rem", padding: 0, lineHeight: 1 }}>✕</button>
                      </div>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          ) : (
            <div style={{ background: T.card, border: `1px dashed ${T.dashed}`, borderRadius: "14px", padding: "26px", marginBottom: "20px", textAlign: "center" }}>
              <div style={{ fontSize: "1.8rem", marginBottom: "8px" }}>👇</div>
              <div style={{ fontSize: "0.95rem", color: T.sub }}>Pick a showtime below to start building your day</div>
              <div style={{ fontSize: "0.78rem", marginTop: "6px", color: T.hint }}>Bright times = available &nbsp;·&nbsp; Dim times = conflicts with your current plan</div>
            </div>
          )}

          {/* DOT LEGEND */}
          {plan.length > 0 && (
            <div style={{ display: "flex", gap: "18px", alignItems: "center", marginBottom: "12px", flexWrap: "wrap", fontSize: "0.74rem", color: T.muted }}>
              <span style={{ fontWeight: 700, color: T.sub }}>Gap dots:</span>
              {[["#2ecc71", "15+ min", "comfortable"], ["#f39c12", "5–15 min", "tight"], ["#e74c3c", "<5 min", "very tight"]].map(([clr, range, label]) => (
                <span key={clr} style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                  <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: clr, display: "inline-block", flexShrink: 0 }} />
                  <span><strong style={{ color: T.sub }}>{range}</strong> — {label}</span>
                </span>
              ))}
            </div>
          )}

          {/* MOVIE GRID */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(290px, 1fr))", gap: "14px" }}>
            {MOVIES.map((movie) => {
              const anyJoinable = SHOWTIMES[movie.id].some(p => isJoinable(p));
              const expanded    = expandedId === movie.id;
              return (
                <div key={movie.id} style={{ background: T.card, borderRadius: "12px", padding: "16px", border: `1px solid ${colorOf(movie.id)}22` }}>

                  {/* Header row */}
                  <div style={{ display: "flex", gap: "11px", marginBottom: "10px", alignItems: "flex-start" }}>
                    <div style={{ width: "44px", height: "44px", borderRadius: "10px", background: colorOf(movie.id)+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "1.4rem", flexShrink: 0 }}>
                      {movie.emoji}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                        <span style={{ fontWeight: 700, fontSize: "0.95rem" }}>{movie.title}</span>
                        {movie.postCredits && <span title="Has a post/mid-credits scene" style={{ fontSize: "0.72rem" }}>⚡</span>}
                        <button onClick={() => setExpandedId(expanded ? null : movie.id)} title={expanded ? "Hide info" : "Show synopsis & info"}
                          style={{ marginLeft: "auto", width: "20px", height: "20px", borderRadius: "50%", border: `1px solid ${T.inputBorder}`, background: expanded ? "#f7971e22" : T.input, color: expanded ? "#f7971e" : T.muted, cursor: "pointer", fontSize: "0.65rem", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontWeight: 700 }}>
                          {expanded ? "✕" : "?"}
                        </button>
                      </div>
                      <div style={{ color: T.muted, fontSize: "0.74rem", marginTop: "2px" }}>{movie.genre} · {movie.rating} · {toDuration(movie.runtime)}</div>
                    </div>
                  </div>

                  {/* Expanded synopsis & info */}
                  {expanded && (
                    <div style={{ background: T.synopsisBg, borderRadius: "8px", padding: "12px 14px", marginBottom: "12px", lineHeight: "1.55" }}>
                      {/* Synopsis */}
                      <p style={{ fontSize: "0.8rem", color: T.sub, marginBottom: "10px" }}>{movie.synopsis}</p>
                      {/* Meta row */}
                      <div style={{ display: "flex", flexDirection: "column", gap: "5px", fontSize: "0.74rem" }}>
                        <div style={{ display: "flex", gap: "6px" }}>
                          <span style={{ color: T.muted, minWidth: "52px" }}>Director</span>
                          <span style={{ color: T.text, fontWeight: 600 }}>{movie.director}</span>
                        </div>
                        <div style={{ display: "flex", gap: "6px" }}>
                          <span style={{ color: T.muted, minWidth: "52px" }}>Cast</span>
                          <span style={{ color: T.text }}>{movie.cast.join(", ")}</span>
                        </div>
                        <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
                          <span style={{ color: T.muted, minWidth: "52px" }}>Score</span>
                          <span style={{ color: "#ffd200", fontWeight: 700 }}>★ {movie.tmdbScore}</span>
                          <span style={{ color: T.faint, fontSize: "0.68rem" }}>/ 10 · TMDB</span>
                        </div>
                      </div>
                      {/* Post-credits note */}
                      {movie.postCredits && (
                        <div style={{ marginTop: "8px", fontSize: "0.72rem", color: "#f7971e", fontWeight: 600 }}>⚡ Stay for a post-credits scene</div>
                      )}
                      {/* Trailer link */}
                      <a href={movie.trailerUrl} target="_blank" rel="noopener noreferrer"
                        style={{ display: "inline-flex", alignItems: "center", gap: "5px", marginTop: "10px", padding: "6px 12px", borderRadius: "20px", background: "#e74c3c22", border: "1px solid #e74c3c55", color: "#e74c3c", fontSize: "0.76rem", fontWeight: 700, textDecoration: "none", transition: "background 0.15s" }}
                        onMouseEnter={e => e.currentTarget.style.background = "#e74c3c33"}
                        onMouseLeave={e => e.currentTarget.style.background = "#e74c3c22"}>
                        ▶ Watch Trailer
                      </a>
                    </div>
                  )}

                  {/* Showtime buttons */}
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "7px" }}>
                    {SHOWTIMES[movie.id].map(posted => {
                      const sel   = isSelected(movie.id, posted);
                      const avail = isAvailable(movie.id, posted);
                      const join  = isJoinable(posted);
                      const gap   = gapFromLast(movie.id, posted);
                      const dot   = gap !== null ? gapColor(gap) : null;
                      const rs    = realStart(posted);
                      const re    = effectiveEnd(movie.id, posted);
                      const tip   = !join  ? "This showing has already started" :
                                    !avail ? "Not compatible with your current plan" :
                                    [
                                      `Start: ${toTime(rs)}   End: ${toTime(re)}`,
                                      `(${toTime(posted)} posted + ${offset} min preshow${skipCredits?" − 8 min credits":""})`,
                                      gap !== null ? `Gap from last: ${toDuration(gap)} ${gapEmoji(gap)}` : "",
                                    ].filter(Boolean).join("\n");
                      return (
                        <button key={posted} onClick={() => handleClick(movie.id, posted)} title={tip}
                          style={{ padding: "6px 12px", borderRadius: "20px", border: "none", cursor: avail ? "pointer" : "default", fontSize: "0.8rem", fontWeight: sel ? 700 : 400, background: sel ? colorOf(movie.id) : avail ? T.input : theme==="dark" ? "#0c0c16" : "#e8eaf2", color: sel ? "#fff" : avail ? T.text : T.faint, boxShadow: sel ? `0 0 10px ${colorOf(movie.id)}66` : "none", outline: dot && !sel ? `2px solid ${dot}55` : "none", transition: "all 0.15s", display: "flex", alignItems: "center", gap: "5px" }}>
                          {toTime(posted)}{sel ? " ✓" : ""}
                          {dot && !sel && avail && <span style={{ width: "6px", height: "6px", borderRadius: "50%", background: dot, display: "inline-block", flexShrink: 0 }} />}
                        </button>
                      );
                    })}
                  </div>

                  {!anyJoinable && isToday && (
                    <div style={{ fontSize: "0.72rem", color: "#e74c3c99", marginTop: "9px" }}>All showings today have passed</div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{ textAlign: "center", marginTop: "40px", paddingBottom: "24px", color: T.faint, fontSize: "0.72rem" }}>
            Demo — showtimes are illustrative · Real version uses live showtimes API + TMDB data
          </div>

          {/* TOAST */}
          {toast && (
            <div style={{ position: "fixed", bottom: "28px", left: "50%", transform: "translateX(-50%)", background: "#2ecc71", color: "#fff", padding: "11px 22px", borderRadius: "24px", fontWeight: 700, fontSize: "0.88rem", zIndex: 9999, pointerEvents: "none", boxShadow: "0 4px 24px #00000055", whiteSpace: "nowrap" }}>
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
